name: Daily freelance lead scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r ai-money-agent/requirements.txt
      - name: Run lead scanner
        working-directory: ai-money-agent
        run: python main.py
      - name: Save CSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freelance-leads
          path: ai-money-agent/leads.csv
          if-no-files-found: ignore
          retention-days: 7
